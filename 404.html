<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | 24vMedia</title>

<link rel="stylesheet" href="style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#090909;
text-align:center;
padding:20px;
}

.error-page{
max-width:700px;
}

.error-page h1{
font-size:8rem;
color:#b44cff;
margin-bottom:15px;
}

.error-page h2{
font-size:2.5rem;
margin-bottom:20px;
}

.error-page p{
color:#cfcfcf;
margin-bottom:40px;
font-size:1.1rem;
line-height:1.8;
}

.error-page a{
display:inline-block;
padding:15px 38px;
border-radius:999px;
background:#b44cff;
color:white;
font-weight:700;
text-decoration:none;
transition:.3s;
}

.error-page a:hover{
transform:translateY(-3px);
box-shadow:0 12px 30px rgba(180,76,255,.35);
}

</style>

</head>

<body>

<div class="error-page">

<h1>404</h1>

<h2>Looks like this page spun its tires.</h2>

<p>
The page you're looking for doesn't exist or has been moved.
Head back to the 24vMedia homepage and keep exploring.
</p>

<a href="index.html">
Return Home
</a>

</div>

</body>
</html>
